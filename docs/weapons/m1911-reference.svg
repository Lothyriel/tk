<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 620">
  <title>Colt Government Series 70 external authoring views</title>
  <desc>Original TK interpretation of Colt Classic exterior reference. Side, front and top silhouettes with independently moving slide, barrel and hammer. Front and top are unmeasured reconstructions.</desc>
  <rect width="1000" height="620" fill="#f8fafc"/>
  <g font-family="sans-serif" fill="#172033">
    <text x="30" y="32" font-size="22">M1911 — O1911C Government Series 70 (V)</text>
    <text x="30" y="57" font-size="14">5 in barrel / .45 ACP / 7-round base magazine (F). Not a dimensioned manufacturer drawing.</text>
    <text x="30" y="91">SIDE — muzzle left; slide over frame, short trigger, angled wood panels, spur hammer</text>
  </g>
  <g stroke="#172033" stroke-width="3">
    <path d="M100 128 H500 L515 187 H100 Z" fill="#687587"/>
    <path d="M107 191 H490 L541 215 L548 311 L475 329 L425 233 H355 L341 219 H107 Z" fill="#8995a5"/>
    <path d="M428 235 L487 227 L525 304 L481 316 Z" fill="#906243"/>
    <path d="M357 195 H422 L437 242 H385 L357 223 Z" fill="none"/>
    <path d="M398 199 V223 H411" fill="none"/>
    <path d="M494 130 L526 114 L537 124 L510 149" fill="#505e70"/>
    <path d="M119 128 V115 H135 V128 M472 128 V111 H490 V128" fill="#505e70"/>
    <path d="M476 329 L547 311 L552 325 L481 342 Z" fill="#505e70"/>
  </g>
  <path d="M75 164 H560" stroke="#2f71b8" stroke-dasharray="6 5"/>
  <g font-family="sans-serif" fill="#172033">
    <text x="30" y="382">TOP — centred sights; right-side ejection window; slide and barrel have distinct tracks</text>
    <text x="645" y="100">FRONT — inferred section</text>
  </g>
  <g stroke="#172033" stroke-width="3" fill="#8995a5">
    <rect x="100" y="410" width="405" height="62" rx="10"/>
    <rect x="119" y="432" width="16" height="18" fill="#505e70"/>
    <path d="M472 424 H490 V458 H472 Z" fill="#505e70"/>
    <path d="M385 415 H441 V436 H385 Z" fill="#f8fafc"/>
    <path d="M505 434 H532 V449 H505" fill="#505e70"/>
    <path d="M718 145 L728 127 H784 L794 145 V209 H718 Z"/>
    <circle cx="756" cy="158" r="20" fill="#f8fafc"/>
    <circle cx="756" cy="158" r="12" fill="#505e70"/>
    <circle cx="756" cy="195" r="9" fill="#505e70"/>
    <rect x="752" y="112" width="8" height="15" fill="#505e70"/>
  </g>
  <path d="M75 441 H560" stroke="#2f71b8" stroke-dasharray="6 5"/>
  <g font-family="sans-serif" font-size="14" fill="#172033">
    <text x="30" y="524">Grey boundaries identify rigid moving groups, not quantized mesh boundaries.</text>
    <text x="30" y="550">Front/top are interpreted from the exterior and manual; fine widths are not measured facts.</text>
    <text x="30" y="576">Review short recoil, slide lock-open, moving sights and hammer in the asset/mechanics gates.</text>
    <text x="30" y="602">Primary reference provenance: ../WEAPON_REFERENCES.md (C1–C6).</text>
  </g>
</svg>
