    <rect x="695" y="388" width="181" height="18"/>
    <rect x="876" y="381" width="40" height="32"/>
    <path d="M160 541 L177 515 H191 L208 541" fill="none"/>
    <rect x="147" y="544" width="76" height="49" rx="9"/>
    <circle cx="185" cy="564" r="13" fill="#f8fafc"/>
    <path d="M185 538 V527" fill="none"/>
