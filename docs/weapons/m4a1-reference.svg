  <path d="M40 397 H935" stroke="#2f71b8" stroke-dasharray="6 5"/>
  <g font-family="sans-serif" font-size="14" fill="#172033">
    <text x="280" y="550">Right-side ejection / left-side bolt catch are asymmetric.</text>
    <text x="280" y="574">Front/top depth and small controls require qualification at asset gate.</text>
    <text x="280" y="598">Source photos and dimension provenance: ../WEAPON_REFERENCES.md (F1/F2).</text>
  </g>
</svg>
