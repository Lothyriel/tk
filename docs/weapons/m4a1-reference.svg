<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 620">
  <title>M4A1 external authoring views</title>
  <desc>Original TK interpretation of FN exterior reference photos. Side, front and top silhouettes. Front and top are unmeasured reconstructions, not manufacturer drawings.</desc>
  <rect width="1000" height="620" fill="#f8fafc"/>
  <g font-family="sans-serif" fill="#172033">
    <text x="30" y="32" font-size="22">M4A1 — exterior authoring sheet (V)</text>
    <text x="30" y="57" font-size="14">14.5 in barrel (F); 29.75–33 in overall (F). Grey shapes are schematic, not final geometry.</text>
    <text x="30" y="91">SIDE — barrel points right; separate stock, receiver, magazine and handguard</text>
  </g>
  <g stroke="#172033" stroke-width="3" fill="#8995a5">
    <path d="M60 138 H220 V170 L150 225 H70 Z"/>
    <rect x="220" y="139" width="80" height="25"/>
    <path d="M300 125 H505 V180 H430 L400 203 H350 L320 180 H300 Z"/>
    <path d="M352 179 L388 193 L360 262 L326 248 Z" fill="#505e70"/>
    <path d="M430 180 H480 L489 252 L510 295 L467 307 L444 258 Z"/>
    <rect x="512" y="127" width="180" height="58" rx="4" fill="#505e70"/>
    <rect x="695" y="143" width="181" height="17"/>
    <rect x="876" y="137" width="40" height="29"/>
    <path d="M694 141 V91 H709 L738 141 Z" fill="none"/>
    <path d="M311 126 V107 H331 V126" fill="none"/>
    <path d="M375 185 H421 V213 H386 Z" fill="none"/>
  </g>
  <path d="M40 151 H935" stroke="#2f71b8" stroke-dasharray="6 5"/>
  <g font-family="sans-serif" fill="#172033">
    <text x="30" y="340">TOP — inferred widths; keep bore, upper, handguard and stock on one axis</text>
    <text x="30" y="500">FRONT — inferred section; open sight guard above bore, handguard around barrel</text>
  </g>
  <g stroke="#172033" stroke-width="3" fill="#8995a5">
    <rect x="60" y="367" width="160" height="62" rx="8"/>
    <rect x="220" y="385" width="80" height="26"/>
    <rect x="300" y="365" width="205" height="66"/>
    <rect x="327" y="382" width="155" height="28" fill="#505e70"/>
